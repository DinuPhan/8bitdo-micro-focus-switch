[package]
name = "eightbitdo-micro-gui"
version = "0.1.0"
description = "Focus-aware input remapper and visual configurator for the 8BitDo Micro"
authors = ["Dinu Phan"]
edition = "2021"

[lib]
name = "eightbitdo_micro_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
