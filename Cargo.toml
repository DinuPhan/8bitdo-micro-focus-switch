[package]
name = "eightbitdo-micro-focus-switch"
version = "0.3.3"
description = "Focus-aware input remapper, visual configurator, and BLE GATT flasher for 8BitDo Micro"
authors = ["Dinu Phan"]
edition = "2021"
default-run = "8bitdo-micro-focus-switch"

[[bin]]
name = "8bitdo-micro-focus-switch"
path = "src/main.rs"

[lib]
name = "eightbitdo_micro_focus_switch"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
indexmap = "2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
base64 = "0.22"
btleplug = "0.11"
uuid = "1"
futures = "0.3"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = { version = "0.12", features = ["tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

